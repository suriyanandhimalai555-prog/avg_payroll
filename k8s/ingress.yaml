apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avgpayroll-frontend
  namespace: avgpayroll
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: avgpayroll.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avgpayroll-frontend
                port:
                  name: http
    - host: www.avgpayroll.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avgpayroll-frontend
                port:
                  name: http
    - host: api.avgpayroll.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avgpayroll-backend
                port:
                  name: http
  tls:
    - hosts:
        - avgpayroll.com
        - www.avgpayroll.com
        - api.avgpayroll.com
      secretName: avgpayroll-tls
