apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: avgpayroll-ci-deployer
  namespace: avgpayroll-fresh
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - avgpayroll-backend
      - avgpayroll-frontend
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
