apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: avgpayroll-backend
  namespace: avgpayroll-fresh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: avgpayroll-backend
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: avgpayroll-frontend
  namespace: avgpayroll-fresh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: avgpayroll-frontend
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
