name: AVG Payroll - Build and Publish Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build Backend ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set image tags
        id: image
        shell: bash
        run: |
          echo "sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=avgpayroll-backend
          cache-to: type=gha,mode=max,scope=avgpayroll-backend
          tags: ghcr.io/${{ steps.image.outputs.owner }}/avgpayroll-backend:${{ steps.image.outputs.sha }}

  build-frontend:
    name: Build Frontend ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set image tags
        id: image
        shell: bash
        run: |
          echo "sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/arm64
          build-args: |
            VITE_API_URL=https://api.avgpayroll.com
          push: true
          cache-from: type=gha,scope=avgpayroll-frontend
          cache-to: type=gha,mode=max,scope=avgpayroll-frontend
          tags: ghcr.io/${{ steps.image.outputs.owner }}/avgpayroll-frontend:${{ steps.image.outputs.sha }}
