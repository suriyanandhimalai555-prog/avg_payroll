
name: Deploy to Kubernetes

on:
  workflow_run:
    workflows:
      - AVG Payroll Image Build
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: avgpayroll-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AVG Payroll
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the image build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify required SSH secrets
        env:
          SSH_HOST: ${{ secrets.AVGPAYROLL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.AVGPAYROLL_SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.AVGPAYROLL_SSH_PRIVATE_KEY }}
          SSH_FINGERPRINT: ${{ secrets.AVGPAYROLL_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USERNAME"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_FINGERPRINT"
          echo "Required SSH secrets are configured."

      - name: Configure SSH and verify VPS host
        env:
          SSH_HOST: ${{ secrets.AVGPAYROLL_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.AVGPAYROLL_SSH_PRIVATE_KEY }}
          SSH_FINGERPRINT: ${{ secrets.AVGPAYROLL_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/avgpayroll_key"
          unset SSH_PRIVATE_KEY
          chmod 600 "$RUNNER_TEMP/avgpayroll_key"

          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" \
            2>/dev/null > "$RUNNER_TEMP/avgpayroll_known_hosts"

          ACTUAL="$(ssh-keygen -lf "$RUNNER_TEMP/avgpayroll_known_hosts" | awk 'NR==1 {print $2}')"
          if [ "$ACTUAL" != "$SSH_FINGERPRINT" ]; then
            echo "VPS host fingerprint mismatch; refusing connection."
            exit 1
          fi
          echo "VPS host fingerprint verified."

      - name: Validate deployment manifests
        run: |
          set -euo pipefail
          test -f k8s/namespace.yaml
          test -f k8s/backend.yaml
          test -f k8s/frontend.yaml
          test -f k8s/ingress.yaml


      - name: Prepare manifests for this commit
        env:
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Invalid image tag."
            exit 1
          fi

          sed -E "s|(image: ghcr.io/suriyanandhimalai555-prog/avgpayroll-backend:).*|\1${IMAGE_TAG}|" \
            k8s/backend.yaml > "$RUNNER_TEMP/avgpayroll-backend.yaml"

          sed -E "s|(image: ghcr.io/suriyanandhimalai555-prog/avgpayroll-frontend:).*|\1${IMAGE_TAG}|" \
            k8s/frontend.yaml > "$RUNNER_TEMP/avgpayroll-frontend.yaml"

          grep -F "avgpayroll-backend:${IMAGE_TAG}" "$RUNNER_TEMP/avgpayroll-backend.yaml"
          grep -F "avgpayroll-frontend:${IMAGE_TAG}" "$RUNNER_TEMP/avgpayroll-frontend.yaml"

      - name: Copy manifests to VPS
        env:
          SSH_HOST: ${{ secrets.AVGPAYROLL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.AVGPAYROLL_SSH_USERNAME }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/avgpayroll_key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/avgpayroll_known_hosts"
          )

          scp "${SSH_OPTS[@]}" k8s/namespace.yaml \
            "$SSH_USERNAME@$SSH_HOST:/tmp/avgpayroll-namespace-${GITHUB_SHA}.yaml"
          scp "${SSH_OPTS[@]}" "$RUNNER_TEMP/avgpayroll-backend.yaml" \
            "$SSH_USERNAME@$SSH_HOST:/tmp/avgpayroll-backend-${GITHUB_SHA}.yaml"
          scp "${SSH_OPTS[@]}" "$RUNNER_TEMP/avgpayroll-frontend.yaml" \
            "$SSH_USERNAME@$SSH_HOST:/tmp/avgpayroll-frontend-${GITHUB_SHA}.yaml"
          scp "${SSH_OPTS[@]}" k8s/ingress.yaml \
            "$SSH_USERNAME@$SSH_HOST:/tmp/avgpayroll-ingress-${GITHUB_SHA}.yaml"

      - name: Restore namespace and deploy resources
        env:
          SSH_HOST: ${{ secrets.AVGPAYROLL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.AVGPAYROLL_SSH_USERNAME }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$RUNNER_TEMP/avgpayroll_key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/avgpayroll_known_hosts"
          )

          ssh "${SSH_OPTS[@]}" "$SSH_USERNAME@$SSH_HOST" \
            "set -eu
             if [ ! -f /home/ubuntu/office/apps/avg_payroll/server/.env ]; then
               echo 'Required server/.env file is missing.'
               exit 1
             fi
             if ! grep -qE '^[[:space:]]*DATABASE_URL=' /home/ubuntu/office/apps/avg_payroll/server/.env; then
               echo 'Required variable DATABASE_URL is missing.'
               exit 1
             fi

             if ! grep -qE '^[[:space:]]*JWT_SECRET=' /home/ubuntu/office/apps/avg_payroll/server/.env; then
               echo 'Required variable JWT_SECRET is missing.'
               exit 1
             fi

             kubectl apply -f /tmp/avgpayroll-namespace-${GITHUB_SHA}.yaml

             kubectl apply --dry-run=server -f /tmp/avgpayroll-backend-${GITHUB_SHA}.yaml
             kubectl apply --dry-run=server -f /tmp/avgpayroll-frontend-${GITHUB_SHA}.yaml
             kubectl apply --dry-run=server -f /tmp/avgpayroll-ingress-${GITHUB_SHA}.yaml

             kubectl create secret generic avgpayroll-backend-env \
               --namespace avgpayroll \
               --from-env-file=/home/ubuntu/office/apps/avg_payroll/server/.env \
               --dry-run=client -o yaml | kubectl apply -f -

             kubectl apply -f /tmp/avgpayroll-backend-${GITHUB_SHA}.yaml
             kubectl apply -f /tmp/avgpayroll-frontend-${GITHUB_SHA}.yaml
             kubectl apply -f /tmp/avgpayroll-ingress-${GITHUB_SHA}.yaml

             kubectl -n avgpayroll rollout status deployment/avgpayroll-backend --timeout=300s
             kubectl -n avgpayroll rollout status deployment/avgpayroll-frontend --timeout=300s

             kubectl -n avgpayroll get deployments,pods,services,ingress

             rm -f /tmp/avgpayroll-namespace-${GITHUB_SHA}.yaml \
                   /tmp/avgpayroll-backend-${GITHUB_SHA}.yaml \
                   /tmp/avgpayroll-frontend-${GITHUB_SHA}.yaml \
                   /tmp/avgpayroll-ingress-${GITHUB_SHA}.yaml"

      - name: Verify public API health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-connrefused \
            https://api.avgpayroll.com/health

  notify-success:
    name: Email deployment success
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send success notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.AVGPAYROLL_SMTP_HOST }}
          server_port: ${{ secrets.AVGPAYROLL_SMTP_PORT }}
          secure: ${{ secrets.AVGPAYROLL_SMTP_PORT == '465' }}
          username: ${{ secrets.AVGPAYROLL_SMTP_USERNAME }}
          password: ${{ secrets.AVGPAYROLL_SMTP_PASSWORD }}
          from: devops@avgprimetech.com
          to: devops@avgprimetech.com, ranjithram878@gmail.com
          subject: "AVG Payroll Deployment Successful"
          html_body: |
            <h2>AVG Payroll Deployment Successful</h2>
            <table border="1" cellpadding="8">
              <tr><td><b>Repository</b></td><td>${{ github.repository }}</td></tr>
              <tr><td><b>Branch</b></td><td>${{ github.event.workflow_run.head_branch }}</td></tr>
              <tr><td><b>Commit</b></td><td>${{ github.event.workflow_run.head_sha }}</td></tr>
              <tr><td><b>Developer</b></td><td>${{ github.actor }}</td></tr>
              <tr><td><b>Architecture</b></td><td>ARM64</td></tr>
              <tr><td><b>Status</b></td><td>SUCCESS</td></tr>
            </table>

  notify-failure:
    name: Email deployment failure
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.AVGPAYROLL_SMTP_HOST }}
          server_port: ${{ secrets.AVGPAYROLL_SMTP_PORT }}
          secure: ${{ secrets.AVGPAYROLL_SMTP_PORT == '465' }}
          username: ${{ secrets.AVGPAYROLL_SMTP_USERNAME }}
          password: ${{ secrets.AVGPAYROLL_SMTP_PASSWORD }}
          from: devops@avgprimetech.com
          to: devops@avgprimetech.com, ranjithram878@gmail.com
          subject: "AVG Payroll Deployment Failed"
          body: |
            AVG Payroll automatic deployment did not complete successfully.
            Repository: ${{ github.repository }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            Commit: ${{ github.event.workflow_run.head_sha }}
            Check the GitHub Actions run for details.
